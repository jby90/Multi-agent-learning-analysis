name: multiagent-online

services:
  database:
    image: multiagent-decision-database:1.1.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ref_contest_db
      MYSQL_USER: ref_reader
      MYSQL_PASSWORD: ${REF_READER_PASSWORD:?REF_READER_PASSWORD is required}
    command: ["mysqld", "--local-infile=ON"]
    volumes:
      - database_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    mem_limit: 640m

  backend:
    image: multiagent-decision-backend:online
    build:
      context: ../..
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_HOST: database
      MYSQL_PORT: "3306"
      REF_READER_PASSWORD: ${REF_READER_PASSWORD:?REF_READER_PASSWORD is required}
      REF_AUTH_USER: ref_auth
      REF_AUTH_PASSWORD: ${REF_AUTH_PASSWORD:?REF_AUTH_PASSWORD is required}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?ADMIN_INITIAL_PASSWORD is required}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      REF_DOMAIN_CONFIG: production_progress
      REF_DEMO_MODE: live
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?DASHSCOPE_API_KEY is required}
    volumes:
      - backend_runtime:/app/runtime
    networks:
      - internal
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',8765),2); s.close()",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    mem_limit: 768m

  frontend:
    image: multiagent-decision-frontend:online
    build:
      context: ../..
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
    networks:
      - internal
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    mem_limit: 128m

volumes:
  database_data:
  backend_runtime:

networks:
  internal:
    driver: bridge
